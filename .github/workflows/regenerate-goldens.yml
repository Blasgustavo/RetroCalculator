name: Regenerate goldens on Linux

on:
  push:
    branches: [feature/design-studio-v3]
    paths:
      - .github/workflows/regenerate-goldens.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate spec goldens
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Regenerate goldens on the canonical CI renderer
        run: flutter test --update-goldens test/goldens/spec_renderer_golden_test.dart

      - name: Commit regenerated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/goldens/*.png
          if git diff --cached --quiet; then
            echo "No golden changes"
          else
            git commit -m "test(design): regenerate goldens on linux" -m "Los PNG canónicos se generan con Flutter 3.44 en Ubuntu, el mismo entorno que Android CI. Windows rasteriza distinto incluso con Ahem, DPR y escala fijos."
            git push origin HEAD:feature/design-studio-v3
          fi
